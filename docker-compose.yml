services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: worksphere
      POSTGRES_PASSWORD: worksphere_dev_only
      POSTGRES_DB: worksphere
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - worksphere_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksphere -d worksphere"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  worksphere_pgdata:
